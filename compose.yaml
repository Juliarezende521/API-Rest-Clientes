services:
  postgres:
    image: postgres:17-alpine
    container_name: api-clientes-postgres
    environment:
      POSTGRES_DB: clientes
      POSTGRES_USER: clientes
      POSTGRES_PASSWORD: clientes
    ports:
      - "5432:5432"
    volumes:
      - clientes_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clientes -d clientes"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  clientes_postgres_data:
